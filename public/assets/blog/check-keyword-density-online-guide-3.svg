<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Keyword density edit path</title>
  <desc id="desc">A path from keyword density data to edited headings, body copy, and internal links.</desc>
  <rect width="1280" height="720" fill="#132018"/>
  <rect x="92" y="88" width="1096" height="544" rx="26" fill="#f7fee7"/>
  <text x="146" y="164" fill="#172554" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">Turn the score into edits</text>
  <g fill="none" stroke="#65a30d" stroke-width="6" stroke-linecap="round">
    <path d="M220 420 C350 260, 470 260, 600 420 S850 580, 1020 340"/>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <circle cx="220" cy="420" r="48" fill="#bef264"/>
    <text x="194" y="430" fill="#365314" font-size="26" font-weight="800">1</text>
    <text x="146" y="508" fill="#334155" font-size="22">Find repeated terms</text>
    <circle cx="600" cy="420" r="48" fill="#86efac"/>
    <text x="574" y="430" fill="#14532d" font-size="26" font-weight="800">2</text>
    <text x="512" y="508" fill="#334155" font-size="22">Rewrite for intent</text>
    <circle cx="1020" cy="340" r="48" fill="#a7f3d0"/>
    <text x="994" y="350" fill="#064e3b" font-size="26" font-weight="800">3</text>
    <text x="900" y="430" fill="#334155" font-size="22">Add useful links</text>
  </g>
</svg>
