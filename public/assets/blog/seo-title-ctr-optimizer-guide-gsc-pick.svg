<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Choose a low CTR page from GSC</title>
  <desc id="desc">A Search Console style table showing impressions, clicks, CTR, and priority for page title refreshes.</desc>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect x="80" y="72" width="1040" height="486" rx="24" fill="#ffffff" stroke="#dbeafe" stroke-width="4"/>
  <text x="120" y="135" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">GSC low-CTR pick list</text>
  <text x="120" y="176" font-family="Arial, sans-serif" font-size="20" fill="#475569">Start with pages that already have impressions, then refresh title and meta.</text>
  <g font-family="Arial, sans-serif" font-size="18">
    <rect x="120" y="230" width="960" height="54" rx="12" fill="#ecfdf5"/>
    <text x="150" y="264" font-weight="700" fill="#166534">Page</text>
    <text x="560" y="264" font-weight="700" fill="#166534">Impr.</text>
    <text x="690" y="264" font-weight="700" fill="#166534">Clicks</text>
    <text x="820" y="264" font-weight="700" fill="#166534">CTR</text>
    <text x="940" y="264" font-weight="700" fill="#166534">Action</text>
    <text x="150" y="334" fill="#334155">/tools/on-page-seo-checker</text>
    <text x="572" y="334" fill="#334155">6.6k</text>
    <text x="710" y="334" fill="#334155">18</text>
    <text x="823" y="334" fill="#dc2626">0.3%</text>
    <text x="940" y="334" fill="#0f766e">Rewrite snippet</text>
    <line x1="120" x2="1080" y1="366" y2="366" stroke="#e2e8f0"/>
    <text x="150" y="416" fill="#334155">/blog/on-page-seo-guide</text>
    <text x="572" y="416" fill="#334155">920</text>
    <text x="710" y="416" fill="#334155">9</text>
    <text x="823" y="416" fill="#f59e0b">1.0%</text>
    <text x="940" y="416" fill="#0f766e">Improve promise</text>
  </g>
</svg>
