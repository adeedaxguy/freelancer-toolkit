<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Keyword density decision table</title>
  <desc id="desc">A visual decision table for interpreting keyword density results.</desc>
  <rect width="1280" height="720" fill="#0b1220"/>
  <rect x="94" y="92" width="1092" height="536" rx="24" fill="#ffffff"/>
  <text x="150" y="165" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">What the density result means</text>
  <g font-family="Inter, Arial, sans-serif" font-size="24">
    <rect x="150" y="230" width="300" height="300" rx="18" fill="#e0f2fe"/>
    <text x="184" y="286" fill="#075985" font-weight="800">Too high</text>
    <text x="184" y="334" fill="#334155" font-size="20">Repeated phrase</text>
    <text x="184" y="368" fill="#334155" font-size="20">Thin copy</text>
    <text x="184" y="402" fill="#334155" font-size="20">Awkward headings</text>
    <rect x="490" y="230" width="300" height="300" rx="18" fill="#dcfce7"/>
    <text x="524" y="286" fill="#166534" font-weight="800">Healthy</text>
    <text x="524" y="334" fill="#334155" font-size="20">Topic is clear</text>
    <text x="524" y="368" fill="#334155" font-size="20">Variants fit naturally</text>
    <text x="524" y="402" fill="#334155" font-size="20">Next steps are linked</text>
    <rect x="830" y="230" width="300" height="300" rx="18" fill="#fee2e2"/>
    <text x="864" y="286" fill="#991b1b" font-weight="800">Too low</text>
    <text x="864" y="334" fill="#334155" font-size="20">Missing target language</text>
    <text x="864" y="368" fill="#334155" font-size="20">Weak title match</text>
    <text x="864" y="402" fill="#334155" font-size="20">Unclear page job</text>
  </g>
</svg>
