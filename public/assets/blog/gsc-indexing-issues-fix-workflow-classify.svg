<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Classify Search Console indexing issues</title>
  <desc id="desc">A triage board classifying GSC issues into fix, expected, and monitor lanes.</desc>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <text x="90" y="95" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#0f172a">Classify before you validate</text>
  <g font-family="Arial, sans-serif">
    <rect x="90" y="150" width="300" height="360" rx="22" fill="#fee2e2"/>
    <text x="240" y="205" text-anchor="middle" font-size="28" font-weight="700" fill="#991b1b">Fix</text>
    <text x="120" y="260" font-size="20" fill="#7f1d1d">Wrong canonical</text>
    <text x="120" y="310" font-size="20" fill="#7f1d1d">Broken redirect</text>
    <text x="120" y="360" font-size="20" fill="#7f1d1d">Blocked money page</text>
    <rect x="450" y="150" width="300" height="360" rx="22" fill="#ecfdf5"/>
    <text x="600" y="205" text-anchor="middle" font-size="28" font-weight="700" fill="#166534">Expected</text>
    <text x="480" y="260" font-size="20" fill="#14532d">Old redirect URL</text>
    <text x="480" y="310" font-size="20" fill="#14532d">Parameter duplicate</text>
    <text x="480" y="360" font-size="20" fill="#14532d">Private noindex page</text>
    <rect x="810" y="150" width="300" height="360" rx="22" fill="#fffbeb"/>
    <text x="960" y="205" text-anchor="middle" font-size="28" font-weight="700" fill="#92400e">Monitor</text>
    <text x="840" y="260" font-size="20" fill="#78350f">Recently published</text>
    <text x="840" y="310" font-size="20" fill="#78350f">Low internal links</text>
    <text x="840" y="360" font-size="20" fill="#78350f">Needs recrawl</text>
  </g>
</svg>
