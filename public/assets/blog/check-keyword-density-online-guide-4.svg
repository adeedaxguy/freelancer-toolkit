<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Keyword density QA loop</title>
  <desc id="desc">A QA loop connecting keyword density, title, headings, meta description, and internal links.</desc>
  <rect width="1280" height="720" fill="#111827"/>
  <rect x="100" y="86" width="1080" height="548" rx="26" fill="#f8fafc"/>
  <text x="160" y="160" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800">Publish only after the loop passes</text>
  <g font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">
    <rect x="178" y="252" width="220" height="104" rx="18" fill="#dbeafe"/>
    <text x="220" y="316" fill="#1e3a8a">Density</text>
    <rect x="530" y="210" width="220" height="104" rx="18" fill="#fef9c3"/>
    <text x="602" y="274" fill="#854d0e">Title</text>
    <rect x="882" y="252" width="220" height="104" rx="18" fill="#fee2e2"/>
    <text x="944" y="316" fill="#991b1b">Headings</text>
    <rect x="708" y="450" width="220" height="104" rx="18" fill="#dcfce7"/>
    <text x="758" y="514" fill="#166534">Internal links</text>
    <rect x="354" y="450" width="220" height="104" rx="18" fill="#ede9fe"/>
    <text x="392" y="514" fill="#5b21b6">Meta snippet</text>
  </g>
  <g fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 14">
    <path d="M400 286 C475 240, 520 235, 530 248"/>
    <path d="M750 262 C830 246, 865 252, 882 285"/>
    <path d="M992 356 C980 440, 934 480, 928 496"/>
    <path d="M708 502 C638 526, 595 526, 574 502"/>
    <path d="M354 502 C260 486, 210 420, 220 356"/>
  </g>
</svg>
