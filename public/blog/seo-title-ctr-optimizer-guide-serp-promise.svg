<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">SERP promise rewrite</title>
  <desc id="desc">A before and after SERP snippet showing a vague title changed into a useful title promise.</desc>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <text x="90" y="95" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Rewrite the SERP promise, not only the keyword</text>
  <rect x="90" y="145" width="1020" height="150" rx="18" fill="#ffffff" stroke="#fecaca" stroke-width="4"/>
  <text x="125" y="192" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#991b1b">Before</text>
  <text x="125" y="232" font-family="Arial, sans-serif" font-size="24" fill="#1d4ed8">SEO Checker Online</text>
  <text x="125" y="268" font-family="Arial, sans-serif" font-size="18" fill="#64748b">Check SEO online with our tool.</text>
  <rect x="90" y="340" width="1020" height="170" rx="18" fill="#ffffff" stroke="#bbf7d0" stroke-width="4"/>
  <text x="125" y="389" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#166534">After</text>
  <text x="125" y="429" font-family="Arial, sans-serif" font-size="24" fill="#1d4ed8">Free On-Page SEO Checker | Title, Meta, H1 and Links</text>
  <text x="125" y="466" font-family="Arial, sans-serif" font-size="18" fill="#64748b">Check the page fields you can fix before publishing, then request indexing with cleaner signals.</text>
</svg>
