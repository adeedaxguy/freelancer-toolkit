<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Sitemap and internal links support discovery</title>
  <desc id="desc">A diagram connecting new pages to sitemap, category links, blog links, and GSC inspection.</desc>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <text x="100" y="100" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#0f172a">Discovery needs more than a URL</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="460" y="180" width="280" height="110" rx="22" fill="#ffffff" stroke="#0f766e" stroke-width="5"/>
    <text x="600" y="230" font-size="24" font-weight="700" fill="#0f172a">New indexable page</text>
    <text x="600" y="262" font-size="16" fill="#475569">Unique, useful, canonical</text>
    <rect x="120" y="380" width="220" height="90" rx="18" fill="#dbeafe"/>
    <text x="230" y="433" font-size="20" fill="#1e3a8a">Sitemap</text>
    <rect x="380" y="380" width="220" height="90" rx="18" fill="#dcfce7"/>
    <text x="490" y="433" font-size="20" fill="#166534">Category link</text>
    <rect x="640" y="380" width="220" height="90" rx="18" fill="#fef3c7"/>
    <text x="750" y="433" font-size="20" fill="#92400e">Blog support</text>
    <rect x="900" y="380" width="220" height="90" rx="18" fill="#ede9fe"/>
    <text x="1010" y="433" font-size="20" fill="#5b21b6">GSC inspect</text>
  </g>
  <path d="M560 290L230 380M580 290L490 380M620 290L750 380M640 290L1010 380" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
</svg>
