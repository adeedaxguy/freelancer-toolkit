<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Proof block layout</title>
  <desc id="desc">A proof block uses a table, checklist, example, or data drop.</desc>
  <rect width="720" height="360" rx="18" fill="#f4f8fb"/>
  <text x="44" y="58" fill="#102b3a" font-family="Arial, sans-serif" font-size="24" font-weight="700">Cite-worthy proof block</text>
  <rect x="44" y="88" width="632" height="216" rx="14" fill="#ffffff" stroke="#bed2dd"/>
  <line x1="44" y1="145" x2="676" y2="145" stroke="#bed2dd"/>
  <line x1="250" y1="88" x2="250" y2="304" stroke="#bed2dd"/>
  <line x1="470" y1="88" x2="470" y2="304" stroke="#bed2dd"/>
  <g fill="#143042" font-family="Arial, sans-serif" font-size="16" font-weight="700">
    <text x="70" y="123">Question</text>
    <text x="276" y="123">Evidence</text>
    <text x="496" y="123">Action</text>
  </g>
  <g fill="#4f6570" font-family="Arial, sans-serif" font-size="14">
    <text x="70" y="184">What does the user</text>
    <text x="70" y="205">need to decide?</text>
    <text x="276" y="184">Source, checklist,</text>
    <text x="276" y="205">example, or data.</text>
    <text x="496" y="184">Tool, signup,</text>
    <text x="496" y="205">or contact path.</text>
    <text x="70" y="248">What changes the</text>
    <text x="70" y="269">answer?</text>
    <text x="276" y="248">Constraints and</text>
    <text x="276" y="269">exceptions.</text>
    <text x="496" y="248">FAQ and schema.</text>
  </g>
</svg>
